<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1050" width="1680" height="1050">
<rect width="1680" height="1050" fill="#0F0F12"/>
<defs>
<marker id="aF2777A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F2777A"/></marker>
<marker id="a5FCF80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5FCF80"/></marker>
<marker id="aE8A33D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#E8A33D"/></marker>
<marker id="a7FB2E5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7FB2E5"/></marker>
</defs>

<text x="60" y="58" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#EDEDF0" font-weight="700" text-anchor="start" letter-spacing="2">MYNTRA WISHLIST COMPARE  ·  MVP ARCHITECTURE</text>
<text x="60" y="88" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#EDEDF0" font-weight="700" text-anchor="start">One saved wishlist in — a swipeable, session-scoped comparison deck out</text>

<!-- Frontend -->
<rect x="60" y="400" width="330" height="240" rx="16" fill="#16161B" stroke="#3A3A46" stroke-width="2"/>
<text x="90" y="450" font-family="Inter, Helvetica, Arial, sans-serif" font-size="21" fill="#EDEDF0" font-weight="600" text-anchor="start">Frontend</text>
<text x="90" y="496" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#9A9AA8" font-weight="400" text-anchor="start">— Action</text>
<text x="90" y="532" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#EDEDF0" font-weight="400" text-anchor="start">"Compare these 3 shirts</text>
<text x="90" y="554" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#EDEDF0" font-weight="400" text-anchor="start">in my size"</text>
<text x="90" y="620" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6B6B78" font-weight="400" text-anchor="start">Next.js 15 · React · Tailwind · Framer Motion</text>

<line x1="400" y1="520" x2="478" y2="520" stroke="#E8A33D" stroke-width="2" marker-end="url(#aE8A33D)"/>
<text x="439" y="505" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" fill="#E8A33D" font-weight="600" text-anchor="middle">fetch</text>

<!-- Backend outer -->
<rect x="490" y="150" width="1130" height="730" rx="18" fill="#121216" stroke="#3A3A46" stroke-width="2"/>
<text x="1055" y="190" font-family="Inter, Helvetica, Arial, sans-serif" font-size="19" fill="#EDEDF0" font-weight="600" text-anchor="middle">Backend — Next.js Route Handlers on Vercel, no separate server</text>

<!-- State (red) -->
<rect x="520" y="440" width="170" height="230" rx="14" fill="#16161B" stroke="#F2777A" stroke-width="2"/>
<text x="545" y="482" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#F2777A" font-weight="600" text-anchor="start">State</text>
<text x="545" y="518" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#EDEDF0" font-weight="400" text-anchor="start">— wishlist</text>
<text x="545" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#EDEDF0" font-weight="400" text-anchor="start">— selection · deck</text>
<text x="545" y="562" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#EDEDF0" font-weight="400" text-anchor="start">— bag · sizeProfile</text>
<text x="545" y="598" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9A9AA8" font-weight="400" text-anchor="start">Zustand + persist,</text>
<text x="545" y="618" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9A9AA8" font-weight="400" text-anchor="start">sessionStorage —</text>
<text x="545" y="638" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9A9AA8" font-weight="400" text-anchor="start">never a database</text>

<line x1="695" y1="545" x2="800" y2="545" stroke="#F2777A" stroke-width="2" marker-end="url(#aF2777A)"/>

<!-- Pipeline (orange) -->
<rect x="775" y="225" width="370" height="600" rx="16" fill="none" stroke="#E8A33D" stroke-width="2"/>
<text x="960" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#E8A33D" font-weight="600" text-anchor="middle">Route Handlers</text>

<rect x="805" y="290" width="310" height="72" rx="12" fill="#1A1A20" stroke="#F2777A" stroke-width="2"/>
<text x="825" y="318" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.5" fill="#F2777A" font-weight="600" text-anchor="start">GET /api/catalog</text>
<text x="825" y="340" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#9A9AA8" font-weight="400" text-anchor="start">Products + reviews, Zod-validated</text>

<line x1="960" y1="362" x2="960" y2="384" stroke="#F2777A" stroke-width="2" marker-end="url(#aF2777A)"/>
<rect x="805" y="388" width="310" height="72" rx="12" fill="#1A1A20" stroke="#F2777A" stroke-width="2"/>
<text x="825" y="416" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.5" fill="#EDEDF0" font-weight="600" text-anchor="start">GET /api/inventory</text>
<text x="825" y="438" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#9A9AA8" font-weight="400" text-anchor="start">Polled every 8s while /compare is open</text>

<line x1="960" y1="460" x2="960" y2="482" stroke="#F2777A" stroke-width="2" marker-end="url(#aF2777A)"/>
<rect x="805" y="486" width="310" height="72" rx="12" fill="#1A1A20" stroke="#F2777A" stroke-width="2"/>
<text x="825" y="514" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.5" fill="#EDEDF0" font-weight="600" text-anchor="start">Size check</text>
<text x="825" y="536" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#9A9AA8" font-weight="400" text-anchor="start">null when no brand signal — never a guess</text>

<line x1="960" y1="558" x2="960" y2="580" stroke="#F2777A" stroke-width="2" marker-end="url(#aF2777A)"/>
<rect x="805" y="584" width="310" height="72" rx="12" fill="#1A1A20" stroke="#F2777A" stroke-width="2"/>
<text x="825" y="612" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.5" fill="#EDEDF0" font-weight="600" text-anchor="start">POST /api/summarize</text>
<text x="825" y="634" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#9A9AA8" font-weight="400" text-anchor="start">Gemini 3.6 Flash · 35s timeout · cached</text>

<line x1="960" y1="656" x2="960" y2="678" stroke="#F2777A" stroke-width="2" marker-end="url(#aF2777A)"/>
<rect x="805" y="682" width="310" height="61" rx="12" fill="#1A1A20" stroke="#F2777A" stroke-width="2"/>
<text x="825" y="712" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15.5" fill="#F2777A" font-weight="600" text-anchor="start">Fallback-first</text>
<text x="825" y="734" font-family="Inter, Helvetica, Arial, sans-serif" font-size="11.5" fill="#9A9AA8" font-weight="400" text-anchor="start">Every call has a precomputed fallback</text>

<!-- Render (green) -->
<rect x="1200" y="225" width="390" height="600" rx="16" fill="none" stroke="#5FCF80" stroke-width="2"/>
<text x="1395" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#5FCF80" font-weight="600" text-anchor="middle">Comparison screen</text>

<text x="1235" y="320" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" fill="#EDEDF0" font-weight="600" text-anchor="start">What the shopper sees</text>
<text x="1235" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#5FCF80" font-weight="400" text-anchor="start">→  Leader labels, up to 2 per card</text>
<text x="1235" y="408" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#5FCF80" font-weight="400" text-anchor="start">→  AI-recommended size, or the</text>
<text x="1263" y="434" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#5FCF80" font-weight="400" text-anchor="start">size guide — never a guess</text>
<text x="1235" y="474" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#5FCF80" font-weight="400" text-anchor="start">→  Review themes, negatives</text>
<text x="1263" y="500" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#5FCF80" font-weight="400" text-anchor="start">surfaced, not hidden</text>
<text x="1235" y="540" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#5FCF80" font-weight="400" text-anchor="start">→  One neutral "Pick for you"</text>
<text x="1263" y="566" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#5FCF80" font-weight="400" text-anchor="start">card — never an automatic winner</text>

<rect x="1235" y="620" width="320" height="175" rx="14" fill="#1A1A20" stroke="#5FCF80" stroke-width="2"/>
<text x="1395" y="668" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#5FCF80" font-weight="600" text-anchor="middle">Comparison</text>
<text x="1395" y="700" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#5FCF80" font-weight="600" text-anchor="middle">deck</text>
<text x="1265" y="738" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9A9AA8" font-weight="400" text-anchor="start">2–4 items, rows aligned pixel-for-pixel,</text>
<text x="1265" y="755" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9A9AA8" font-weight="400" text-anchor="start">Add to Bag / See product / two-tier</text>
<text x="1265" y="772" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#9A9AA8" font-weight="400" text-anchor="start">Remove, all without leaving the deck</text>

<line x1="1120" y1="712" x2="1232" y2="640" stroke="#5FCF80" stroke-width="2" marker-end="url(#a5FCF80)"/>
<line x1="1395" y1="586" x2="1395" y2="614" stroke="#5FCF80" stroke-width="2" marker-end="url(#a5FCF80)"/>

<text x="60" y="950" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#EDEDF0" font-weight="400" text-anchor="start">Not a real backend. Catalog, inventory, size intelligence and reviews are all Zod-validated seed JSON in /data — the only external call in the whole system is a single</text>
<text x="60" y="970" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#EDEDF0" font-weight="400" text-anchor="start">server-side Gemini request, so the mock boundary stays explicit rather than hidden, and the shopper never sees a broken or empty state.</text>
<text x="60" y="1000" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12" fill="#6B6B78" font-weight="400" text-anchor="start">Known scope: no database, no auth/payments, Shirts &amp; Pants only. Mobile-first (390×844) — desktop renders the same app inside a centred phone frame, not a separate layout.</text>
</svg>
